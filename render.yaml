services:
  - type: web
    name: arbuda-times-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: PLATFORM_DATABASE
        value: arbuda_platform
      - key: CORS_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_NAME
        value: arbuda_session
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: CUSTOMER_SESSION_COOKIE_NAME
        value: arbuda_customer_session
      - key: CUSTOMER_SESSION_TTL_DAYS
        value: "30"
